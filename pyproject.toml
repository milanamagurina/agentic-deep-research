[project]
name = "evidence-research"
version = "0.1.0"
description = "Probabilistic evidence deep-research agent on Nebius Token Factory + Tavily"
readme = "README.md"
requires-python = ">=3.12"
# Lower bounds are the versions this project was tested with.
dependencies = [
    "openai>=3.35.1",
    "tavily-python>=0.8.5",
    "pydantic>=2.14.1",
    "networkx>=3.6.1",
    "streamlit>=1.66.0",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-p no:cacheprovider"
